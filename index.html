<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lagerbuch Küche &amp; Bar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky ticket-rail header with tabs; one working view at a time; dense tables that scroll inside their own box. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunk: #e8ecea;
  --line: #d3dad7;
  --fg: #18211e;
  --muted: #5b6a65;
  --accent: #2f6b4f;
  --accent-fg: #ffffff;
  --accent-soft: #dcebe3;
  --ok: #2f7d4f;
  --warn: #a8670b;
  --warn-soft: #fbedd5;
  --crit: #b3261e;
  --crit-soft: #f8dcd9;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1a2220; --sunk: #222c29; --line: #2f3b37; --fg: #e6ece9; --muted: #9aaba5;
    --accent: #6fc195; --accent-fg: #0d1a14; --accent-soft: #1f3a2d;
    --ok: #6fc195; --warn: #e6a94a; --warn-soft: #3a2c14; --crit: #f08a80; --crit-soft: #3f1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1a2220; --sunk: #222c29; --line: #2f3b37; --fg: #e6ece9; --muted: #9aaba5;
  --accent: #6fc195; --accent-fg: #0d1a14; --accent-soft: #1f3a2d;
  --ok: #6fc195; --warn: #e6a94a; --warn-soft: #3a2c14; --crit: #f08a80; --crit-soft: #3f1d1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 10px 0; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: .8rem; color: var(--muted); }
.sync { margin-left: auto; font-size: .8rem; color: var(--muted); }
nav.tabs { flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { font: 600 1rem var(--font-display); letter-spacing: .04em; text-transform: uppercase; background: none; border: 0; color: var(--muted); padding: 10px 14px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs .count { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--crit); color: var(--surface); font-size: .78rem; text-align: center; }
main { padding-block: 20px 60px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.kpi .value { font: 700 2rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: .82rem; color: var(--muted); }
.kpi.alert .value { color: var(--crit); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; align-items: start; }
.tbl-box { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.num { text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--accent-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.crit { color: var(--crit); background: var(--crit-soft); }
.pill.neutral { color: var(--muted); background: var(--sunk); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); position: relative; min-width: 70px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ok); }
.bar i.warn { background: var(--warn); } .bar i.crit { background: var(--crit); }
.bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .45; }
button, .btn { font: 600 .92rem var(--font-body); border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 13px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.danger { color: var(--crit); }
button.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; min-width: 0; }
input.qty { width: 86px; text-align: right; font-variant-numeric: tabular-nums; }
input.qty.changed { border-color: var(--accent); background: var(--accent-soft); }
label.f { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted); }
label.f input, label.f select, label.f textarea { font-weight: 400; color: var(--fg); font-size: .95rem; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.form .wide { grid-column: 1 / -1; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days label { display: inline-flex; gap: 4px; align-items: center; font-size: .9rem; color: var(--fg); font-weight: 500; }
.supplier-card { border-top: 4px solid var(--accent); }
.supplier-card.draft { border-top-color: var(--warn); }
.ticket { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .85rem; white-space: pre-wrap; background: var(--sunk); border-radius: 5px; padding: 12px; margin: 0; overflow-x: auto; }
.notice { padding: 10px 14px; border-radius: 6px; background: var(--warn-soft); color: var(--fg); font-size: .9rem; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 16px; padding: 5px 12px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.diff-pos { color: var(--ok); } .diff-neg { color: var(--crit); }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); padding: 0; width: min(720px, calc(100% - 24px)); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .dhead { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
dialog .dbody { padding: 16px; display: grid; gap: 14px; max-height: 70vh; overflow-y: auto; }
dialog .dfoot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.loc-head td { background: var(--sunk); font: 600 .8rem var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
@media (max-width: 560px) { .hide-sm { display: none; } h2 { font-size: 1.35rem; } .kpi .value { font-size: 1.7rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand" id="brand">Lagerbuch <small id="bizName">Küche &amp; Bar</small></div>
    <div class="sync" id="sync">Verbinde mit Speicher …</div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const COLS = ["items", "suppliers", "orders", "counts"];
const S = { items: {}, suppliers: {}, orders: {}, counts: {}, settings: { autoDrafts: true, businessName: "" } };
let db = null, downloads = null, canWrite = true, ready = false, live = false;
let tab = "uebersicht";
let invLoc = "Alle", artFilter = "", artCat = "Alle";
let countDraft = {};   // itemId -> string
let orderEdits = {};   // supplierId -> {itemId: qty}
let confirmKey = null;
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const CATS = ["Getränke", "Spirituosen", "Fleisch & Fisch", "Molkerei", "Obst & Gemüse", "Trockenware", "Tiefkühl", "Reinigung", "Verpackung"];
const LOCS = ["Kühlhaus", "Trockenlager", "Bar", "Keller", "Tiefkühler", "Putzraum"];
const UNITS = ["Stk", "kg", "L", "Fl", "Kiste", "Pkg", "Dose", "Kanister", "Karton"];

try { const d = JSON.parse(localStorage.getItem("lagerbuch.countDraft") || "{}"); if (d && typeof d === "object") countDraft = d; } catch (e) {}
try { const t = localStorage.getItem("lagerbuch.tab"); if (t) tab = t; } catch (e) {}

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 2 });
const eur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const fmt = n => nf.format(Number(n) || 0);
const money = n => eur.format(Number(n) || 0);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const dateStr = ts => ts ? new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–";
const dtStr = ts => ts ? new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "–";
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const list = col => Object.entries(S[col]).map(([id, v]) => ({ id, ...v }));
const byName = (a, b) => String(a.name).localeCompare(String(b.name), "de");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}

// ---------- storage ----------
async function write(col, id, data, merge = true) {
  if (!canWrite) { toast("Nur Lesezugriff – Änderungen werden nicht gespeichert."); return false; }
  if (!db) {
    S[col][id] = merge && S[col][id] ? { ...S[col][id], ...data } : data;
    saveLocal(); render(); return true;
  }
  try {
    const ref = db.doc(col + "/" + id);
    if (merge && S[col][id]) await ref.update(data); else await ref.set(merge && S[col][id] ? { ...S[col][id], ...data } : data);
    return true;
  } catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; render(); toast("Speichern abgelehnt – du hast hier nur Lesezugriff."); }
    else if (e && e.code === "quota_exceeded") toast("Speicher voll: bitte alte Inventuren oder Bestellungen löschen.");
    else toast("Speichern fehlgeschlagen. Bitte erneut versuchen.");
    return false;
  }
}
async function remove(col, id) {
  if (!canWrite) return;
  if (!db) { delete S[col][id]; saveLocal(); render(); return; }
  try { await db.doc(col + "/" + id).delete(); } catch (e) { toast("Löschen fehlgeschlagen."); }
}
function saveLocal() { try { localStorage.setItem("lagerbuch.local", JSON.stringify(S)); } catch (e) {} }
function loadLocal() { try { const d = JSON.parse(localStorage.getItem("lagerbuch.local") || "null"); if (d) for (const k of [...COLS, "settings"]) if (d[k]) S[k] = d[k]; } catch (e) {} }

async function init() {
  render();
  const timer = setTimeout(() => { if (!live) $("#sync").textContent = "Speicher noch nicht erreichbar – Daten evtl. veraltet"; }, 10000);
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  try { downloads = await window.claude?.use?.("downloads"); } catch (e) { downloads = null; }
  try { const user = await window.claude?.use?.("user"); if (user) { const c = await user.can("data.write"); if (c === false) canWrite = false; } } catch (e) {}
  if (!db) {
    clearTimeout(timer); loadLocal(); ready = true; live = true;
    $("#sync").textContent = "Lokaler Modus – Daten nur in diesem Browser";
    autoDrafts(); render(); return;
  }
  const seen = new Set();
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S[col] = o;
      if (!snap.metadata.fromCache) seen.add(col);
      if (seen.size === COLS.length + 1 && !live) { live = true; clearTimeout(timer); autoDrafts(); }
      ready = true; updateSync(); render();
    }, err => { $("#sync").textContent = "Verbindung zum Speicher unterbrochen"; clearTimeout(timer); });
  });
  db.doc("config/settings").onSnapshot(snap => {
    if (snap.exists) S.settings = { ...S.settings, ...snap.data() };
    if (!snap.metadata.fromCache) seen.add("settings");
    if (seen.size === COLS.length + 1 && !live) { live = true; clearTimeout(timer); autoDrafts(); }
    updateSync(); render();
  }, () => {});
}
function updateSync() { $("#sync").textContent = live ? (canWrite ? "Gespeichert · live synchron" : "Nur Lesezugriff") : "Lade …"; }

// ---------- domain logic ----------
function openQty(itemId) {
  let q = 0;
  for (const o of list("orders")) if (o.status === "bestellt" || o.status === "entwurf")
    for (const l of (o.lines || [])) if (l.itemId === itemId) q += num(l.qty);
  return q;
}
function itemState(it) {
  const sup = S.suppliers[it.supplierId];
  const lead = sup ? num(sup.leadDays) : 1;
  const use = num(it.dailyUse);
  const stock = num(it.stock), min = num(it.min), target = Math.max(num(it.target), min);
  const onOrder = openQty(it.id);
  const projected = stock + onOrder - use * lead;
  let qty = 0;
  if (projected <= min) {
    qty = target + use * lead - (stock + onOrder);
    const pack = num(it.packSize) || 1;
    qty = qty > 0 ? Math.ceil(qty / pack - 1e-9) * pack : 0;
  }
  let level = "ok", label = "OK";
  if (stock <= 0) { level = "crit"; label = "Leer"; }
  else if (stock <= min) { level = "crit"; label = "Unter Meldebestand"; }
  else if (stock - use * lead <= min || stock <= min * 1.25) { level = "warn"; label = "Knapp"; }
  if (level !== "ok" && onOrder > 0 && stock + onOrder > min) label += " · bestellt";
  const reach = use > 0 ? stock / use : null;
  return { level, label, qty, onOrder, reach, lead, use, target };
}
function suggestions() {
  const groups = {};
  for (const it of list("items")) {
    const st = itemState(it);
    if (st.qty > 0) {
      const sid = it.supplierId && S.suppliers[it.supplierId] ? it.supplierId : "_none";
      (groups[sid] = groups[sid] || []).push({ it, st });
    }
  }
  return groups;
}
function nextOrderDay(sup) {
  const days = (sup.orderDays || []).map(Number);
  if (!days.length) return null;
  const d = new Date();
  for (let i = 0; i < 7; i++) { const x = new Date(d); x.setDate(d.getDate() + i); if (days.includes(x.getDay())) return { date: x, inDays: i }; }
  return null;
}
function orderText(sup, lines, total) {
  const biz = S.settings.businessName || "unser Betrieb";
  const del = new Date(); del.setDate(del.getDate() + (num(sup.leadDays) || 1));
  const w = Math.max(...lines.map(l => (fmt(l.qty) + " " + l.unit).length), 4);
  return `Betreff: Bestellung ${biz} – ${dateStr(Date.now())}\n\nGuten Tag${sup.contact ? " " + sup.contact : ""},\n\nwir bestellen hiermit:\n\n` +
    lines.map(l => `  ${(fmt(l.qty) + " " + l.unit).padEnd(w)}  ${l.name}${l.sku ? "  (Art.-Nr. " + l.sku + ")" : ""}`).join("\n") +
    `\n\nWarenwert ca. ${money(total)} netto.\nGewünschte Lieferung: ${del.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" })}.\n\nBitte kurz bestätigen. Vielen Dank!\n${biz}`;
}
function buildLines(sid, rows) {
  const ed = orderEdits[sid] || {};
  return rows.map(({ it, st }) => ({
    itemId: it.id, name: it.name, unit: it.unit || "Stk", sku: it.sku || "",
    qty: ed[it.id] !== undefined ? num(ed[it.id]) : st.qty, price: num(it.price)
  })).filter(l => l.qty > 0);
}
// Automatic drafts: on a supplier's order day, prepare one draft per supplier (idempotent id).
async function autoDrafts() {
  if (!S.settings.autoDrafts || !canWrite) return;
  const g = suggestions(), wd = new Date().getDay(), day = today();
  for (const [sid, rows] of Object.entries(g)) {
    if (sid === "_none") continue;
    const sup = S.suppliers[sid];
    if (!(sup.orderDays || []).map(Number).includes(wd)) continue;
    const id = "auto-" + sid + "-" + day;
    if (S.orders[id]) continue;
    const lines = buildLines(sid, rows); if (!lines.length) continue;
    const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
    await write("orders", id, { supplierId: sid, supplierName: sup.name, status: "entwurf", auto: true, lines, total, createdAt: Date.now() }, false);
  }
}

// ---------- views ----------
const TABS = [["uebersicht", "Übersicht"], ["inventur", "Inventur"], ["bestellen", "Bestellen"], ["artikel", "Artikel"], ["lieferanten", "Lieferanten"], ["verlauf", "Verlauf"]];
function renderTabs() {
  const n = Object.keys(suggestions()).length;
  const drafts = list("orders").filter(o => o.status === "entwurf").length;
  $("#tabs").innerHTML = TABS.map(([k, l]) => {
    let badge = "";
    if (k === "bestellen" && (n || drafts)) badge = `<span class="count">${Math.max(n, drafts)}</span>`;
    return `<button role="tab" id="tab-${k}" aria-selected="${tab === k}" data-tab="${k}">${l}${badge}</button>`;
  }).join("");
  $("#bizName").textContent = S.settings.businessName || "Küche & Bar";
}

function render() {
  const a = document.activeElement; const fid = a && a.id; const sel = a && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  renderTabs();
  const v = $("#view");
  if (!ready) { v.innerHTML = `<div class="panel empty"><h3>Lagerbuch wird geladen</h3><p>Artikel, Lieferanten und Bestellungen erscheinen gleich.</p></div>`; return; }
  const ro = canWrite ? "" : `<div class="notice">Du hast nur Lesezugriff. Zählungen und Bestellungen können nicht gespeichert werden.</div>`;
  v.innerHTML = ro + ({ uebersicht: vOverview, inventur: vInventory, bestellen: vOrders, artikel: vItems, lieferanten: vSuppliers, verlauf: vHistory }[tab] || vOverview)();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}

function stockBar(it, st) {
  const max = Math.max(st.target, num(it.stock), 1);
  const pct = Math.min(100, num(it.stock) / max * 100), mpct = Math.min(100, num(it.min) / max * 100);
  return `<div class="bar" title="Bestand ${fmt(it.stock)} / Soll ${fmt(st.target)}"><i class="${st.level === "ok" ? "" : st.level}" style="width:${pct}%"></i><b style="left:${mpct}%"></b></div>`;
}

function vOverview() {
  const items = list("items");
  if (!items.length) return emptyStart();
  const value = items.reduce((s, it) => s + num(it.stock) * num(it.price), 0);
  const states = items.map(it => ({ it, st: itemState(it) }));
  const crit = states.filter(x => x.st.level === "crit"), warn = states.filter(x => x.st.level === "warn");
  const g = suggestions(); const sugTotal = Object.entries(g).reduce((s, [sid, rows]) => s + buildLines(sid, rows).reduce((a, l) => a + l.qty * l.price, 0), 0);
  const open = list("orders").filter(o => o.status === "bestellt");
  const lastCount = list("counts").sort((a, b) => b.at - a.at)[0];
  const attention = [...crit, ...warn].sort((a, b) => (a.st.level === "crit" ? 0 : 1) - (b.st.level === "crit" ? 0 : 1) || byName(a.it, b.it));
  const upcoming = list("suppliers").map(s => ({ s, n: nextOrderDay(s) })).filter(x => x.n).sort((a, b) => a.n.inDays - b.n.inDays);
  return `
  <div class="kpis">
    <div class="kpi"><span class="label">Lagerwert (EK netto)</span><span class="value">${money(value)}</span><span class="sub">${items.length} Artikel</span></div>
    <div class="kpi ${crit.length ? "alert" : ""}"><span class="label">Unter Meldebestand</span><span class="value">${crit.length}</span><span class="sub">${warn.length} weitere knapp</span></div>
    <div class="kpi"><span class="label">Bestellvorschlag</span><span class="value">${money(sugTotal)}</span><span class="sub">${Object.keys(g).length} Lieferant(en)</span></div>
    <div class="kpi"><span class="label">Letzte Inventur</span><span class="value">${lastCount ? dateStr(lastCount.at) : "–"}</span><span class="sub">${open.length} Bestellung(en) unterwegs</span></div>
  </div>
  <div class="grid2">
    <section class="panel">
      <div class="row between"><h3>Braucht Aufmerksamkeit</h3>${Object.keys(g).length ? `<button class="primary" data-tab="bestellen">Bestellvorschlag öffnen</button>` : ""}</div>
      ${attention.length ? `<div class="tbl-box"><table><thead><tr><th>Artikel</th><th class="num">Bestand</th><th class="hide-sm">Füllstand</th><th>Status</th></tr></thead><tbody>
      ${attention.slice(0, 14).map(({ it, st }) => `<tr><td>${esc(it.name)}<div class="small muted">${esc(it.location || "")}${st.reach != null ? " · reicht ca. " + fmt(Math.max(0, st.reach)) + " Tage" : ""}</div></td>
        <td class="num">${fmt(it.stock)} ${esc(it.unit)}</td><td class="hide-sm">${stockBar(it, st)}</td><td><span class="pill ${st.level}">${st.label}</span></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">Alle Bestände liegen über dem Meldebestand.</p>`}
    </section>
    <section class="panel">
      <h3>Nächste Bestelltage</h3>
      ${upcoming.length ? `<div class="tbl-box"><table><tbody>${upcoming.map(({ s, n }) => {
        const rows = g[s.id]; const c = rows ? rows.length : 0;
        return `<tr><td><strong>${esc(s.name)}</strong><div class="small muted">Lieferzeit ${fmt(s.leadDays)} Tag(e)</div></td>
          <td>${n.inDays === 0 ? `<span class="pill warn">heute</span>` : n.date.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}</td>
          <td class="num">${c ? c + " Pos." : `<span class="muted">nichts fällig</span>`}</td></tr>`; }).join("")}</tbody></table></div>`
        : `<p class="muted">Trage bei den Lieferanten Bestelltage ein, dann erscheinen sie hier.</p>`}
      <p class="small muted">${S.settings.autoDrafts ? "Automatik an: An Bestelltagen wird beim Öffnen pro Lieferant ein Bestellentwurf angelegt." : "Automatische Bestellentwürfe sind aus (Einstellung unter Lieferanten)."}</p>
    </section>
  </div>`;
}

function emptyStart() {
  return `<div class="panel empty"><h3>Noch keine Artikel im Lager</h3>
  <p>Leg zuerst deine Lieferanten an, dann die Artikel mit Meldebestand und Sollbestand.<br>Danach rechnet das Lagerbuch die Bestellmengen selbst aus.</p>
  <div class="row" style="justify-content:center"><button data-act="sup-new">Lieferant anlegen</button><button class="primary" data-act="item-new">Ersten Artikel anlegen</button></div></div>`;
}

function vInventory() {
  const items = list("items").sort(byName);
  if (!items.length) return emptyStart();
  const locs = ["Alle", ...LOCS.filter(l => items.some(i => i.location === l)), ...[...new Set(items.map(i => i.location).filter(l => l && !LOCS.includes(l)))]];
  const shown = items.filter(i => invLoc === "Alle" || i.location === invLoc);
  const entered = Object.keys(countDraft).filter(id => S.items[id] && countDraft[id] !== "");
  let diffVal = 0;
  entered.forEach(id => { diffVal += (num(countDraft[id]) - num(S.items[id].stock)) * num(S.items[id].price); });
  const grouped = {};
  shown.forEach(i => { (grouped[i.location || "Ohne Lagerort"] = grouped[i.location || "Ohne Lagerort"] || []).push(i); });
  return `
  <section class="panel" style="display:grid;gap:14px">
    <div class="row between"><div><h2>Inventur zählen</h2><p class="muted small" style="margin:4px 0 0">Gezählte Menge eintragen. Leere Felder bleiben unverändert. Die Eingaben bleiben auf diesem Gerät gespeichert, bis du abschließt.</p></div>
      <div class="row"><button data-act="csv">Zählliste als CSV</button></div></div>
    <div class="filters">${locs.map(l => `<button class="chip" aria-pressed="${invLoc === l}" data-loc="${esc(l)}">${esc(l)}</button>`).join("")}</div>
    <div class="tbl-box"><table><thead><tr><th>Artikel</th><th class="num">Buchbestand</th><th class="num">Gezählt</th><th class="num">Differenz</th><th class="num hide-sm">Wert Diff.</th></tr></thead><tbody>
    ${Object.entries(grouped).map(([loc, arr]) => `<tr class="loc-head"><td colspan="5">${esc(loc)}</td></tr>` + arr.map(it => {
      const v = countDraft[it.id]; const has = v !== undefined && v !== "";
      const d = has ? num(v) - num(it.stock) : null;
      return `<tr><td>${esc(it.name)}<div class="small muted">${esc(it.unit)}${num(it.packSize) > 1 ? " · Gebinde " + fmt(it.packSize) : ""}</div></td>
      <td class="num">${fmt(it.stock)}</td>
      <td class="num"><input class="qty ${has ? "changed" : ""}" id="cnt-${esc(it.id)}" data-count="${esc(it.id)}" inputmode="decimal" value="${has ? esc(v) : ""}" placeholder="${fmt(it.stock)}" aria-label="Gezählt ${esc(it.name)}"></td>
      <td class="num ${d > 0 ? "diff-pos" : d < 0 ? "diff-neg" : ""}">${d === null ? "" : (d > 0 ? "+" : "") + fmt(d)}</td>
      <td class="num hide-sm">${d === null || !d ? "" : money(d * num(it.price))}</td></tr>`; }).join("")).join("")}
    </tbody></table></div>
    <div class="row between">
      <span class="muted">${entered.length} von ${items.length} Artikeln gezählt · Bewertete Differenz <strong class="${diffVal < 0 ? "diff-neg" : ""}">${money(diffVal)}</strong></span>
      <div class="row">${entered.length ? `<button data-act="count-clear">Eingaben verwerfen</button>` : ""}<button class="primary" data-act="count-save" ${entered.length ? "" : "disabled"}>Inventur abschließen</button></div>
    </div>
  </section>`;
}

function vOrders() {
  const g = suggestions();
  const drafts = list("orders").filter(o => o.status === "entwurf").sort((a, b) => b.createdAt - a.createdAt);
  const open = list("orders").filter(o => o.status === "bestellt").sort((a, b) => b.orderedAt - a.orderedAt);
  const sids = Object.keys(g).filter(sid => !drafts.some(d => d.supplierId === sid));
  let html = `<div><h2>Bestellen</h2><p class="muted" style="margin:4px 0 0">Vorschläge entstehen, wenn der Bestand abzüglich Verbrauch bis zur Lieferung unter den Meldebestand fällt. Die Menge füllt bis zum Sollbestand auf, gerundet auf ganze Gebinde. Offene Bestellungen sind schon eingerechnet.</p></div>`;
  if (drafts.length) html += `<h3>Entwürfe</h3><div class="grid2">${drafts.map(o => draftCard(o)).join("")}</div>`;
  html += `<h3>Bestellvorschlag</h3>`;
  if (!sids.length) html += `<div class="panel muted">${Object.keys(g).length ? "Alle Vorschläge liegen bereits als Entwurf oben." : "Gerade ist nichts nachzubestellen."}</div>`;
  else html += `<div class="grid2">${sids.map(sid => suggestCard(sid, g[sid])).join("")}</div>`;
  html += `<h3>Unterwegs</h3>`;
  html += open.length ? `<div class="grid2">${open.map(o => openCard(o)).join("")}</div>` : `<div class="panel muted">Keine offenen Bestellungen.</div>`;
  return html;
}
function linesTable(lines, sid, editable) {
  return `<div class="tbl-box"><table><thead><tr><th>Artikel</th><th class="num">Menge</th><th class="num hide-sm">EK</th><th class="num">Summe</th></tr></thead><tbody>
  ${lines.map(l => `<tr><td>${esc(l.name)}${l.why ? `<div class="small muted">${l.why}</div>` : ""}</td>
    <td class="num">${editable ? `<input class="qty" id="oq-${esc(sid)}-${esc(l.itemId)}" data-oq="${esc(sid)}|${esc(l.itemId)}" inputmode="decimal" value="${fmt(l.qty)}" aria-label="Menge ${esc(l.name)}"> ` : fmt(l.qty) + " "}${esc(l.unit)}</td>
    <td class="num hide-sm">${money(l.price)}</td><td class="num">${money(l.qty * l.price)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function supMinNote(sup, total) {
  if (sup && num(sup.minOrder) > total) return `<div class="notice">Mindestbestellwert ${money(sup.minOrder)} noch nicht erreicht (fehlen ${money(num(sup.minOrder) - total)}).</div>`;
  return "";
}
function suggestCard(sid, rows) {
  const sup = S.suppliers[sid];
  const ed = orderEdits[sid] || {};
  const lines = rows.sort((a, b) => byName(a.it, b.it)).map(({ it, st }) => ({
    itemId: it.id, name: it.name, unit: it.unit, price: num(it.price),
    qty: ed[it.id] !== undefined ? num(ed[it.id]) : st.qty,
    why: `Bestand ${fmt(it.stock)} · Melde ${fmt(it.min)} · Soll ${fmt(st.target)}${st.onOrder ? " · unterwegs " + fmt(st.onOrder) : ""}${st.use ? " · ~" + fmt(st.use) + "/Tag" : ""}`
  }));
  const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
  if (sid === "_none") return `<section class="panel supplier-card" style="display:grid;gap:10px"><h3>Ohne Lieferant</h3><p class="small muted">Diesen Artikeln ist kein Lieferant zugeordnet. Ordne einen zu, damit sie in eine Bestellung kommen.</p>${linesTable(lines, sid, false)}</section>`;
  const n = nextOrderDay(sup);
  return `<section class="panel supplier-card" style="display:grid;gap:10px">
    <div class="row between"><h3>${esc(sup.name)}</h3><span class="small muted">${n ? (n.inDays === 0 ? "Bestelltag heute" : "Bestelltag " + n.date.toLocaleDateString("de-DE", { weekday: "long" })) : ""}</span></div>
    ${linesTable(lines, sid, true)}
    ${supMinNote(sup, total)}
    <div class="row between"><strong>${money(total)} netto</strong><button class="primary" data-act="draft-make" data-sid="${esc(sid)}">Bestellung vorbereiten</button></div>
  </section>`;
}
function draftCard(o) {
  const sup = S.suppliers[o.supplierId] || { name: o.supplierName };
  const txt = orderText(sup, o.lines || [], o.total);
  const k = "del-" + o.id;
  return `<section class="panel supplier-card draft" style="display:grid;gap:10px">
    <div class="row between"><h3>${esc(o.supplierName)}</h3><span class="pill warn">${o.auto ? "Automatischer Entwurf" : "Entwurf"}</span></div>
    ${linesTable(o.lines || [], o.id, false)}
    ${supMinNote(sup, o.total)}
    <details><summary class="small">Bestelltext anzeigen</summary><pre class="ticket" id="txt-${esc(o.id)}">${esc(txt)}</pre></details>
    <div class="small muted">${sup.email ? "E-Mail: <strong>" + esc(sup.email) + "</strong>" : ""}${sup.phone ? " · Tel.: <strong>" + esc(sup.phone) + "</strong>" : ""}</div>
    <div class="row between"><strong>${money(o.total)} netto</strong>

  </section>`;
}
function openCard(o) {
  const k = "storno-" + o.id;
  return `<section class="panel supplier-card" style="display:grid;gap:10px">
    <div class="row between"><h3>${esc(o.supplierName)}</h3><span class="pill neutral">bestellt ${dtStr(o.orderedAt)}</span></div>

    </div></div>
    <div class="dfoot">${id ? (confirmKey === "item-" + id ? `<span class="confirm" style="margin-right:auto">Artikel löschen? <button type="button" class="danger" data-act="item-del" data-id="${esc(id)}">Ja</button><button type="button" data-act="dlg-unask" data-id="${esc(id)}">Nein</button></span>` : `<button type="button" class="danger" style="margin-right:auto" data-act="dlg-ask" data-id="${esc(id)}">Löschen</button>`) : ""}
      <button type="button" data-act="dlg-close">Abbrechen</button><button type="submit" class="primary" data-id="${esc(id || "")}">Speichern</button></div>
  </form>`;
  dlg.dataset.kind = "item"; dlg.dataset.id = id || "";
  if (!dlg.open) dlg.showModal();
}
function supDialog(id) {
  const s = id ? S.suppliers[id] : { orderDays: [], leadDays: 1, minOrder: 0 };
  const dlg = $("#dlg");
  const days = (s.orderDays || []).map(Number);
  dlg.innerHTML = `<form method="dialog" id="sup-form">
    <div class="dhead"><h3>${id ? "Lieferant bearbeiten" : "Neuer Lieferant"}</h3><button type="button" class="link" data-act="dlg-close">Schließen</button></div>
    <div class="dbody"><div class="form">
      <label class="f wide">Name<input id="s-name" required value="${esc(s.name || "")}" placeholder="z. B. Getränke Huber"></label>
      <label class="f">Ansprechpartner<input id="s-contact" value="${esc(s.contact || "")}"></label>
      <label class="f">E-Mail für Bestellungen<input id="s-email" type="email" value="${esc(s.email || "")}"></label>
      <label class="f">Telefon<input id="s-phone" value="${esc(s.phone || "")}"></label>
      <label class="f">Lieferzeit (Tage)<input id="s-leadDays" inputmode="decimal" value="${s.leadDays ?? 1}"></label>
      <label class="f">Mindestbestellwert (€)<input id="s-minOrder" inputmode="decimal" value="${s.minOrder ?? 0}"></label>
      <div class="f wide"><span>Bestelltage</span><div class="days">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label><input type="checkbox" id="s-day-${d}" value="${d}" ${days.includes(d) ? "checked" : ""}> ${WD[d]}</label>`).join("")}</div></div>
      <label class="f wide">Notiz<input id="s-note" value="${esc(s.note || "")}" placeholder="z. B. Bestellschluss 14 Uhr"></label>
    </div></div>
    <div class="dfoot">${id ? (confirmKey === "sup-" + id ? `<span class="confirm" style="margin-right:auto">Lieferant löschen? <button type="button" class="danger" data-act="sup-del" data-id="${esc(id)}">Ja</button><button type="button" data-act="dlg-unask" data-id="${esc(id)}">Nein</button></span>` : `<button type="button" class="danger" style="margin-right:auto" data-act="dlg-ask" data-id="${esc(id)}">Löschen</button>`) : ""}
      <button type="button" data-act="dlg-close">Abbrechen</button><button type="submit" class="primary">Speichern</button></div>
  </form>`;
  dlg.dataset.kind = "sup"; dlg.dataset.id = id || "";
  if (!dlg.open) dlg.showModal();
}

// ---------- actions ----------
async function saveCount() {
  const ids = Object.keys(countDraft).filter(id => S.items[id] && countDraft[id] !== "");
  if (!ids.length) return;
  const now = Date.now(); const lines = []; let value = 0, diffValue = 0;
  const writes = ids.map(id => {
    const it = S.items[id]; const counted = num(countDraft[id]);
    let dailyUse = num(it.dailyUse);
    if (it.lastCountAt) {
      const days = (now - it.lastCountAt) / 864e5;
      const used = num(it.lastCountQty) + num(it.receivedSince) - counted;
      if (days >= 0.5 && used >= 0) { const r = used / days; dailyUse = dailyUse ? Math.round((dailyUse * 0.5 + r * 0.5) * 100) / 100 : Math.round(r * 100) / 100; }
    }
    lines.push({ itemId: id, name: it.name, unit: it.unit, location: it.location || "", expected: num(it.stock), counted, price: num(it.price) });
    diffValue += (counted - num(it.stock)) * num(it.price);
    return write("items", id, { stock: counted, dailyUse, lastCountAt: now, lastCountQty: counted, receivedSince: 0 });
  });
  const results = await Promise.all(writes);
  if (results.some(r => !r)) return;
  // inventory value over all items after count
  list("items").forEach(it => { value += (ids.includes(it.id) ? num(countDraft[it.id]) : num(it.stock)) * num(it.price); });
  await write("counts", "c-" + uid(), { at: now, lines, value: Math.round(value * 100) / 100, diffValue: Math.round(diffValue * 100) / 100 }, false);
  countDraft = {}; persistDraft();
  toast("Inventur gespeichert – " + ids.length + " Positionen");
  render();
}
function persistDraft() { try { localStorage.setItem("lagerbuch.countDraft", JSON.stringify(countDraft)); } catch (e) {} }

async function makeDraft(sid) {
  const rows = suggestions()[sid]; if (!rows) return;
  const sup = S.suppliers[sid];
  const lines = buildLines(sid, rows);
  if (!lines.length) { toast("Alle Mengen sind 0 – nichts zu bestellen."); return; }
  const total = Math.round(lines.reduce((s, l) => s + l.qty * l.price, 0) * 100) / 100;
  if (await write("orders", "o-" + uid(), { supplierId: sid, supplierName: sup.name, status: "entwurf", auto: false, lines, total, createdAt: Date.now() }, false)) {
    delete orderEdits[sid]; toast("Entwurf für " + sup.name + " angelegt");
  }
}
async function receive(id) {
  const o = S.orders[id]; if (!o) return;
  for (const l of (o.lines || [])) {
    const it = S.items[l.itemId]; if (!it) continue;
    await write("items", l.itemId, { stock: Math.round((num(it.stock) + num(l.qty)) * 1000) / 1000, receivedSince: num(it.receivedSince) + num(l.qty) });
  }
  await write("orders", id, { status: "geliefert", receivedAt: Date.now() });
  toast("Wareneingang gebucht – Bestände erhöht");
}
async function exportCsv(rows, name) {
  const csv = "﻿" + rows.map(r => r.map(c => { const s = String(c ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n");
  if (!downloads) {
    // Standalone (z. B. GitHub Pages): normaler Browser-Download
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    catch (e) { toast("Download ist in dieser Ansicht nicht verfügbar."); }
    return;
  }
  try { await downloads.save({ filename: name, data: new Blob([csv], { type: "text/csv" }) }); }
  catch (e) { if (e && e.code !== "declined") toast("Download nicht möglich."); }
}
const dec = n => String(Math.round(num(n) * 100) / 100).replace(".", ",");

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; confirmKey = null; try { localStorage.setItem("lagerbuch.tab", tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  if (t.dataset.loc) { invLoc = t.dataset.loc; render(); return; }
  if (t.dataset.cat) { artCat = t.dataset.cat; render(); return; }
  const act = t.dataset.act; if (!act) return;
  const id = t.dataset.id;
  switch (act) {
    case "item-new": itemDialog(null); break;
    case "item-edit": confirmKey = null; itemDialog(id); break;
    case "sup-new": supDialog(null); break;
    case "sup-edit": confirmKey = null; supDialog(id); break;
    case "dlg-close": confirmKey = null; $("#dlg").close(); break;
    case "dlg-ask": confirmKey = ($("#dlg").dataset.kind === "item" ? "item-" : "sup-") + id; $("#dlg").dataset.kind === "item" ? itemDialog(id) : supDialog(id); break;
    case "dlg-unask": confirmKey = null; $("#dlg").dataset.kind === "item" ? itemDialog(id) : supDialog(id); break;
    case "item-del": confirmKey = null; $("#dlg").close(); await remove("items", id); toast("Artikel gelöscht"); break;
    case "sup-del": confirmKey = null; $("#dlg").close(); await remove("suppliers", id); toast("Lieferant gelöscht"); break;
    case "ask": confirmKey = t.dataset.key; render(); break;
    case "cancel-confirm": confirmKey = null; render(); break;
    case "count-clear": countDraft = {}; persistDraft(); render(); break;
    case "count-save": t.disabled = true; await saveCount(); break;
    case "draft-make": t.disabled = true; await makeDraft(t.dataset.sid); break;
    case "order-del": confirmKey = null; await remove("orders", id); toast("Entwurf verworfen"); break;
    case "order-send": await write("orders", id, { status: "bestellt", orderedAt: Date.now() }); toast("Als bestellt markiert"); break;
    case "order-storno": confirmKey = null; await write("orders", id, { status: "storniert", orderedAt: S.orders[id]?.orderedAt || Date.now() }); toast("Bestellung storniert"); break;
    case "order-receive": t.disabled = true; await receive(id); break;
    case "copy": {
      const o = S.orders[id]; const sup = S.suppliers[o.supplierId] || { name: o.supplierName };
      const txt = orderText(sup, o.lines || [], o.total);
      try { await navigator.clipboard.writeText(txt); toast("Bestelltext kopiert"); }
      catch (x) { const pre = document.getElementById("txt-" + id); if (pre) { pre.closest("details").open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Text markiert – mit Strg+C kopieren"); }
      break;
    }
    case "settings-save": {
      const data = { businessName: $("#set-biz").value.trim(), autoDrafts: $("#set-auto").value === "1" };
      if (!db) { S.settings = { ...S.settings, ...data }; saveLocal(); render(); toast("Gespeichert"); break; }
      try { await db.doc("config/settings").set({ ...S.settings, ...data }); toast("Einstellungen gespeichert"); if (data.autoDrafts) autoDrafts(); } catch (x) { toast("Speichern fehlgeschlagen."); }
      break;
    }
    case "csv": {
      const rows = [["Lagerort", "Artikel", "Einheit", "Buchbestand", "Gezählt", "EK netto"]];
      list("items").sort((a, b) => String(a.location).localeCompare(String(b.location), "de") || byName(a, b)).forEach(it => rows.push([it.location || "", it.name, it.unit, dec(it.stock), "", dec(it.price)]));
      exportCsv(rows, "Zaehlliste-" + today() + ".csv"); break;
    }
    case "count-csv": {
      const c = S.counts[id]; if (!c) break;
      const rows = [["Lagerort", "Artikel", "Einheit", "Buchbestand", "Gezählt", "Differenz", "EK netto", "Wert gezählt"]];
      (c.lines || []).forEach(l => rows.push([l.location, l.name, l.unit, dec(l.expected), dec(l.counted), dec(l.counted - l.expected), dec(l.price), dec(l.counted * l.price)]));
      exportCsv(rows, "Inventur-" + new Date(c.at).toISOString().slice(0, 10) + ".csv"); break;
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.count) { countDraft[el.dataset.count] = el.value.trim(); persistDraft(); clearTimeout(render.t); render.t = setTimeout(render, 350); }
  else if (el.dataset.oq) { const [sid, iid] = el.dataset.oq.split("|"); (orderEdits[sid] = orderEdits[sid] || {})[iid] = el.value; clearTimeout(render.t); render.t = setTimeout(render, 600); }
  else if (el.id === "art-search") { artFilter = el.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.count) {
    e.preventDefault();
    const all = [...document.querySelectorAll("input[data-count]")]; const i = all.indexOf(e.target);
    if (all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const dlg = $("#dlg"); const id = dlg.dataset.id;
  if (e.target.id === "item-form") {
    const g = k => $("#f-" + k).value.trim();
    const data = { name: g("name"), category: g("category"), location: g("location"), unit: g("unit"), sku: g("sku"),
      stock: num(g("stock")), min: num(g("min")), target: num(g("target")), packSize: num(g("packSize")) || 1, price: num(g("price")),
      dailyUse: num(g("dailyUse")), supplierId: g("supplierId"), updatedAt: Date.now() };
    if (!data.name) return;
    if (data.target < data.min) data.target = data.min;
    if (await write("items", id || "i-" + uid(), data)) { dlg.close(); toast("Artikel gespeichert"); }
  } else if (e.target.id === "sup-form") {
    const g = k => $("#s-" + k).value.trim();
    const orderDays = [0, 1, 2, 3, 4, 5, 6].filter(d => $("#s-day-" + d).checked);
    const data = { name: g("name"), contact: g("contact"), email: g("email"), phone: g("phone"), leadDays: num(g("leadDays")), minOrder: num(g("minOrder")), orderDays, note: g("note") };
    if (!data.name) return;
    if (await write("suppliers", id || "s-" + uid(), data)) { dlg.close(); toast("Lieferant gespeichert"); }
  }
});
$("#dlg").addEventListener("close", () => { confirmKey = null; });

init();
})();
</script>
